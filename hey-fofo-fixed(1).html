<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hey fofo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  :root{
    --ink:#2a1c40;
    --panel-bg:#f6f1ff;
    --panel-border:#6d3fc4;
    --accent:#8b5cf6;
    --accent-dark:#54308f;
    --accent-darker:#3d2168;
    --page-bg-1:#1a1329;
    --page-bg-2:#2c1f42;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:
      radial-gradient(ellipse at 30% 15%, rgba(139,92,246,0.18), transparent 55%),
      linear-gradient(160deg, var(--page-bg-1), var(--page-bg-2));
    font-family:'VT323', monospace;
    color:#e9e0ff;
    padding:28px 14px;
  }

  .title{
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    letter-spacing:1px;
    color:#e9e0ff;
    text-shadow: 3px 3px 0 var(--accent-darker);
  }

  .subtitle{
    font-size:19px;
    color:#c9b8f0;
    margin-top:-8px;
  }

  .stage-wrap{
    position:relative;
    width:min(92vw, 760px);
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio: 16 / 9;
    overflow:hidden;
    background:#000;
    clip-path: polygon(
      0 14px, 14px 14px, 14px 0,
      calc(100% - 14px) 0, calc(100% - 14px) 14px, 100% 14px,
      100% calc(100% - 14px), calc(100% - 14px) calc(100% - 14px), calc(100% - 14px) 100%,
      14px 100%, 14px calc(100% - 14px), 0 calc(100% - 14px)
    );
    box-shadow: 0 0 0 4px var(--accent-darker), 0 0 0 8px var(--accent), 10px 12px 0 rgba(0,0,0,0.35);
  }

  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }

  /* ---- thought trail ---- */
  .dot{
    position:absolute;
    background:var(--panel-bg);
    border: 2px solid var(--panel-border);
    transform:translate(-50%,-50%);
    clip-path: polygon(
      0 20%, 20% 20%, 20% 0, 80% 0, 80% 20%, 100% 20%,
      100% 80%, 80% 80%, 80% 100%, 20% 100%, 20% 80%, 0 80%
    );
  }

  /* ---- cloud / panel ---- */
  .pixel-panel{
    background:var(--panel-bg);
    border: 3px solid var(--panel-border);
    box-shadow: 5px 5px 0 rgba(0,0,0,0.35);
    clip-path: polygon(
      0 10px, 10px 10px, 10px 0,
      calc(100% - 10px) 0, calc(100% - 10px) 10px, 100% 10px,
      100% calc(100% - 10px), calc(100% - 10px) calc(100% - 10px), calc(100% - 10px) 100%,
      10px 100%, 10px calc(100% - 10px), 0 calc(100% - 10px)
    );
  }

  .cloud{
    position:absolute;
    left:50%;
    top:6%;
    width:82%;
    transform:translateX(-50%);
    padding:14px 16px;
    color:var(--ink);
    text-align:center;
  }

  .cloud-text{
    font-size: clamp(15px, 2.6vw, 20px);
    line-height:1.35;
    min-height: 1.4em;
  }

  .cloud-choices{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:10px;
  }

  .choice-btn{
    font-family:'VT323', monospace;
    font-size:16px;
    padding:7px 12px;
    background:var(--accent);
    color:#fff;
    border:2px solid var(--accent-darker);
    cursor:pointer;
    box-shadow: 3px 3px 0 var(--accent-darker);
    clip-path: polygon(
      0 6px, 6px 6px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px)
    );
    transition: transform 0.08s ease;
  }
  .choice-btn:hover{ background:var(--accent-dark); }
  .choice-btn:active{ transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--accent-darker); }
  .choice-btn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

  /* ---- fofo reaction bubble ---- */
  .reaction{
    position:absolute;
    left:83%;
    top:56%;
    transform:translate(-50%,-50%) scale(0.6);
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    background:var(--panel-bg);
    border:2px solid var(--panel-border);
    opacity:0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    clip-path: polygon(
      0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
    );
  }
  .reaction.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ---- hearts ---- */
  .heart{
    position:absolute;
    bottom:30%;
    font-size:16px;
    color:#c084fc;
    opacity:0;
    animation: floatHeart 1.8s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatHeart{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    15%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-90px) scale(1.1); }
  }

  .footer{
    font-size:16px;
    color:#8a78b8;
  }

  @media (prefers-reduced-motion: reduce){
    .heart{ animation-duration: 0.01ms; }
    .choice-btn{ transition:none; }
  }
</style>
</head>
<body>

  <audio id="backgroundMusic" loop>
    <source src="Roblox music - Chill Jazz.mp3" type="audio/mpeg">
  </audio>

  <button id="musicButton">♪ Play Music</button>

  <script>
    const music = document.getElementById("backgroundMusic");
    const musicButton = document.getElementById("musicButton");

    musicButton.onclick = () => {
      if (music.paused) {
        music.play();
        musicButton.textContent = "♪ Pause Music";
      } else {
        music.pause();
        musicButton.textContent = "♪ Play Music";
      }
    };
  </script>

  <div class="title">for fofo</div>
  <div class="subtitle">a little invitation</div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="scene"></canvas>

      <div class="dot" id="dot1" style="width:8px;height:8px;"></div>
      <div class="dot" id="dot2" style="width:12px;height:12px;"></div>
      <div class="dot" id="dot3" style="width:16px;height:16px;"></div>

      <div class="cloud pixel-panel">
        <div class="cloud-text" id="cloudText"></div>
        <div class="cloud-choices" id="cloudChoices"></div>
      </div>

      <div class="reaction" id="reaction"></div>
    </div>
  </div>

  <div class="footer">click a choice to continue the story</div>

<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- dialogue tree ---------------- */
  const dialogue = {
    start: {
      text: "hey fofo... i've been thinking about you all day",
      choices: [ { label: "what's up?", next: "ask" } ]
    },
    ask: {
      text: "want to hang out with me for a bit?",
      choices: [
        { label: "play games", next: "games" },
        { label: "drink coffee", next: "coffee" },
        { label: "do both!", next: "both" },
      ]
    },
    games: {
      text: "okay fofo, pick a game for us 💜",
      reaction: "🎮",
      choices: [
        { label: "roblox", next: "game_roblox" },
        { label: "elden ring nightreign", next: "game_nightreign" },
        { label: "cod cold war", next: "game_coldwar" },
        { label: "minecraft", next: "game_minecraft" },
        { label: "vhoulme", next: "game_vhoulme" },
        { label: "backrooms clean up", next: "game_backrooms_cleanup" },
        { label: "backrooms new game", next: "game_backrooms_new" }
      ]
    },

    game_roblox: {
      text: "roblox it is 💜 let's find something fun and play together",
      reaction: "🎮",
      choices: [
        { label: "add coffee too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another game", next: "games" }
      ]
    },

    game_nightreign: {
      text: "elden ring nightreign it is ⚔ let's survive the night together",
      reaction: "⚔",
      choices: [
        { label: "add coffee too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another game", next: "games" }
      ]
    },

    game_coldwar: {
      text: "cod cold war it is 🔫 time to lock in together",
      reaction: "🎮",
      choices: [
        { label: "add coffee too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another game", next: "games" }
      ]
    },

    game_minecraft: {
      text: "minecraft it is ⛏ let's build something cute together",
      reaction: "💜",
      choices: [
        { label: "add coffee too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another game", next: "games" }
      ]
    },

    game_vhoulme: {
      text: "vhoulme it is 👾 let's jump in together",
      reaction: "🎮",
      choices: [
        { label: "add coffee too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another game", next: "games" }
      ]
    },

    game_backrooms_cleanup: {
      text: "backrooms clean up it is 🧹 let's clean up the weirdest place together",
      reaction: "😳",
      choices: [
        { label: "add coffee too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another game", next: "games" }
      ]
    },

    game_backrooms_new: {
      text: "backrooms new game it is 👀 let's see how long we survive",
      reaction: "💜",
      choices: [
        { label: "add coffee too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another game", next: "games" }
      ]
    },
    coffee: {
      text: "okay fofo, what kind of coffee do you want? ☕",
      reaction: "☕",
      choices: [
        { label: "iced v60", next: "coffee_v60" },
        { label: "coffee with milk", next: "coffee_milk" }
      ]
    },

    coffee_v60: {
      text: "iced v60 it is 🧊☕ nice and refreshing",
      reaction: "💜",
      choices: [
        { label: "add games too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another coffee", next: "coffee" }
      ]
    },

    coffee_milk: {
      text: "coffee with milk it is ☕🥛 warm, simple, and cozy",
      reaction: "💜",
      choices: [
        { label: "add games too?", next: "both" },
        { label: "let's go!", next: "yes" },
        { label: "pick another coffee", next: "coffee" }
      ]
    },
    both: {
      text: "perfect 💜 pick a game first, then we'll choose our coffee",
      reaction: "🎮☕",
      choices: [
        { label: "roblox", next: "both_game_roblox" },
        { label: "elden ring nightreign", next: "both_game_nightreign" },
        { label: "cod cold war", next: "both_game_coldwar" },
        { label: "minecraft", next: "both_game_minecraft" },
        { label: "vhoulme", next: "both_game_vhoulme" },
        { label: "backrooms clean up", next: "both_game_backrooms_cleanup" },
        { label: "backrooms new game", next: "both_game_backrooms_new" }
      ]
    },

    both_game_roblox: {
      text: "roblox 💜 now pick our coffee",
      reaction: "🎮",
      choices: [
        { label: "iced v60", next: "both_v60" },
        { label: "coffee with milk", next: "both_milk" },
        { label: "pick another game", next: "both" }
      ]
    },

    both_game_nightreign: {
      text: "elden ring nightreign ⚔ now pick our coffee",
      reaction: "⚔",
      choices: [
        { label: "iced v60", next: "both_v60" },
        { label: "coffee with milk", next: "both_milk" },
        { label: "pick another game", next: "both" }
      ]
    },

    both_game_coldwar: {
      text: "cod cold war 🎮 now pick our coffee",
      reaction: "🎮",
      choices: [
        { label: "iced v60", next: "both_v60" },
        { label: "coffee with milk", next: "both_milk" },
        { label: "pick another game", next: "both" }
      ]
    },

    both_game_minecraft: {
      text: "minecraft ⛏ now pick our coffee",
      reaction: "💜",
      choices: [
        { label: "iced v60", next: "both_v60" },
        { label: "coffee with milk", next: "both_milk" },
        { label: "pick another game", next: "both" }
      ]
    },

    both_game_vhoulme: {
      text: "vhoulme 👾 now pick our coffee",
      reaction: "🎮",
      choices: [
        { label: "iced v60", next: "both_v60" },
        { label: "coffee with milk", next: "both_milk" },
        { label: "pick another game", next: "both" }
      ]
    },

    both_game_backrooms_cleanup: {
      text: "backrooms clean up 🧹 now pick our coffee",
      reaction: "😳",
      choices: [
        { label: "iced v60", next: "both_v60" },
        { label: "coffee with milk", next: "both_milk" },
        { label: "pick another game", next: "both" }
      ]
    },

    both_game_backrooms_new: {
      text: "backrooms new game 👀 now pick our coffee",
      reaction: "💜",
      choices: [
        { label: "iced v60", next: "both_v60" },
        { label: "coffee with milk", next: "both_milk" },
        { label: "pick another game", next: "both" }
      ]
    },

    both_v60: {
      text: "game + iced v60 🧊☕ perfect choice. let's go 💜",
      reaction: "❤❤",
      choices: [
        { label: "let's go!", next: "yes" },
        { label: "change the game", next: "both" }
      ]
    },

    both_milk: {
      text: "game + coffee with milk ☕🥛 perfect choice. let's go 💜",
      reaction: "❤❤",
      choices: [
        { label: "let's go!", next: "yes" },
        { label: "change the game", next: "both" }
      ]
    },
    later: {
      text: "aww, okay... i'll keep the coffee warm just in case",
      reaction: "🥺",
      choices: [
        { label: "actually, let's hang out", next: "ask" },
        { label: "maybe next time", next: "end_sad" }
      ]
    },
    yes: {
      text: "fofo says yes 💜 see you soon",
      reaction: "💜",
      final: true,
      celebrate: true
    },
    end_sad: {
      text: "no worries — there's always next time",
      reaction: "💭",
      final: true
    }
  };

  let current = 'start';

  const cloudText = document.getElementById('cloudText');
  const cloudChoices = document.getElementById('cloudChoices');
  const reactionEl = document.getElementById('reaction');
  const stage = document.getElementById('stage');

  function render(){
    const node = dialogue[current];
    cloudText.textContent = node.text;
    cloudChoices.innerHTML = '';

    if (node.reaction){
      reactionEl.textContent = node.reaction;
      reactionEl.classList.add('show');
    } else {
      reactionEl.classList.remove('show');
    }

    if (node.final){
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = 'play again';
      btn.onclick = () => { current = 'start'; render(); };
      cloudChoices.appendChild(btn);
      if (node.celebrate) celebrate();
    } else {
      node.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.label;
        btn.onclick = () => { current = choice.next; render(); };
        cloudChoices.appendChild(btn);
      });
    }
  }

  function celebrate(){
    if (reduceMotion) return;
    for (let i = 0; i < 7; i++){
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = '💜';
        h.style.left = (20 + Math.random() * 60) + '%';
        h.style.bottom = (18 + Math.random() * 10) + '%';
        stage.appendChild(h);
        setTimeout(() => h.remove(), 2000);
      }, i * 140);
    }
  }

  render();

  /* ---------------- pixel scene ---------------- */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const W = 320, H = 180;
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  const stars = [];
  for (let i = 0; i < 24; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * 90,
      phase: Math.random() * Math.PI * 2
    });
  }

  function drawGround(){
    ctx.fillStyle = '#3e2f52';
    ctx.fillRect(0, 132, W, H - 132);
    ctx.fillStyle = '#493a63';
    for (let x = 0; x < W; x += 16){
      ctx.fillRect(x, 132, 8, H - 132);
    }
  }

  function drawSky(){
    const grad = ctx.createLinearGradient(0, 0, 0, 132);
    grad.addColorStop(0, '#221733');
    grad.addColorStop(1, '#7a4f95');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, 132);
  }

  function drawMoon(){
    ctx.fillStyle = '#fdf3d8';
    ctx.fillRect(268, 18, 16, 16);
    ctx.fillStyle = '#221733';
    ctx.fillRect(268, 18, 4, 4);
    ctx.fillRect(280, 30, 4, 4);
  }

  function drawStars(t){
    stars.forEach(s => {
      const a = 0.5 + 0.5 * Math.sin(t / 600 + s.phase);
      ctx.fillStyle = `rgba(255,255,255,${reduceMotion ? 0.8 : a})`;
      ctx.fillRect(s.x, s.y, 2, 2);
    });
  }

  function drawTable(t){
    const cx = 160, top = 150;
    ctx.fillStyle = '#5a3a24';
    ctx.fillRect(cx - 22, top, 44, 8);
    ctx.fillStyle = '#432a1a';
    ctx.fillRect(cx - 18, top + 8, 4, 20);
    ctx.fillRect(cx + 14, top + 8, 4, 20);

    // two cups
    [cx - 12, cx + 4].forEach((cupX, i) => {
      ctx.fillStyle = '#fdf6ea';
      ctx.fillRect(cupX, top - 8, 8, 8);
      ctx.fillStyle = '#4b2e1d';
      ctx.fillRect(cupX + 1, top - 7, 6, 4);
      ctx.fillStyle = '#a06cd5';
      ctx.fillRect(cupX + 8, top - 6, 2, 4);

      const steamOffset = reduceMotion ? 0 : Math.sin(t / 300 + i) * 1.5;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(cupX + 2 + steamOffset, top - 14, 2, 5);
      ctx.fillRect(cupX + 5 - steamOffset, top - 17, 2, 5);
    });
  }

  function drawCharacter(cx, groundY, palette, mirror, bob){
    const s = mirror ? -1 : 1;
    const y = groundY - bob;

    // legs
    ctx.fillStyle = palette.pants;
    ctx.fillRect(cx - 7, y - 14, 5, 14);
    ctx.fillRect(cx + 2, y - 14, 5, 14);

    // shoes
    ctx.fillStyle = '#241733';
    ctx.fillRect(cx - 8, y - 2, 7, 3);
    ctx.fillRect(cx + 1, y - 2, 7, 3);

    // arms
    if (palette.twintails){
      // Fofo: two cleaner arms with visible hands.
      // Her right arm is on screen-left because she faces toward the other character.
      ctx.fillStyle = palette.shirt;
      ctx.fillRect(cx - 12, y - 35, 5, 12);
      ctx.fillRect(cx - 14, y - 25, 5, 6);
      ctx.fillRect(cx + 7, y - 35, 5, 12);
      ctx.fillRect(cx + 9, y - 25, 5, 6);

      ctx.fillStyle = palette.skin;
      ctx.fillRect(cx - 15, y - 21, 5, 4);
      ctx.fillRect(cx - 14, y - 18, 4, 2);
      ctx.fillRect(cx + 10, y - 21, 5, 4);
      ctx.fillRect(cx + 10, y - 18, 4, 2);
    } else {
      // Ismail: full red sleeves, with only the hands exposed.
      ctx.fillStyle = palette.shirt;
      ctx.fillRect(cx - 12 * s, y - 35, 5, 13);
      ctx.fillRect(cx - 14 * s, y - 24, 5, 7);
      ctx.fillRect(cx + 7 * s, y - 35, 5, 13);
      ctx.fillRect(cx + 9 * s, y - 24, 5, 7);

      ctx.fillStyle = palette.skin;
      ctx.fillRect(cx - 14 * s, y - 18, 5, 4);
      ctx.fillRect(cx + 9 * s, y - 18, 5, 4);
    }

    // body / dress
    ctx.fillStyle = palette.shirt;
    ctx.fillRect(cx - 8, y - 37, 16, 19);
    ctx.fillRect(cx - 10, y - 20, 20, 7);
    ctx.fillStyle = palette.pants;
    ctx.fillRect(cx - 7, y - 13, 5, 11);
    ctx.fillRect(cx + 2, y - 13, 5, 11);

    // neck
    ctx.fillStyle = palette.skin;
    ctx.fillRect(cx - 3, y - 39, 6, 3);

    // head
    ctx.fillStyle = palette.skin;
    ctx.fillRect(cx - 7, y - 51, 14, 15);
    ctx.fillRect(cx - 9, y - 47, 18, 9);

    // hair: larger cap + bangs + distinct twin tails for the girl
    ctx.fillStyle = palette.hair;
    if (palette.twintails){
      ctx.fillRect(cx - 9, y - 54, 18, 8);
      ctx.fillRect(cx - 8, y - 50, 16, 5);

      // left/right side locks
      ctx.fillRect(cx - 10, y - 47, 4, 10);
      ctx.fillRect(cx + 6, y - 47, 4, 10);

      // twin tails, with stepped ends for a cleaner pixel-art silhouette
      ctx.fillRect(cx - 14, y - 49, 5, 9);
      ctx.fillRect(cx - 16, y - 45, 4, 9);
      ctx.fillRect(cx - 14, y - 38, 6, 4);
      ctx.fillRect(cx + 9, y - 49, 5, 9);
      ctx.fillRect(cx + 12, y - 45, 4, 9);
      ctx.fillRect(cx + 8, y - 38, 6, 4);

      // hair ties
      ctx.fillStyle = palette.accent;
      ctx.fillRect(cx - 13, y - 46, 4, 3);
      ctx.fillRect(cx + 9, y - 46, 4, 3);

      // bangs
      ctx.fillStyle = palette.hair;
      ctx.fillRect(cx - 7, y - 48, 4, 5);
      ctx.fillRect(cx - 2, y - 47, 4, 4);
      ctx.fillRect(cx + 3, y - 48, 4, 5);
    } else {
      ctx.fillRect(cx - 8, y - 53, 16, 7);
      ctx.fillRect(cx - 9, y - 49, 5, 8);
      ctx.fillRect(cx + 4, y - 49, 5, 8);
    }

    // eyes
    ctx.fillStyle = '#241733';
    ctx.fillRect(cx - 4, y - 43, 2, 3);
    ctx.fillRect(cx + 2, y - 43, 2, 3);

    // pixel glasses
    if (palette.glasses){
      ctx.fillStyle = '#241733';
      // left frame
      ctx.fillRect(cx - 7, y - 45, 6, 1);
      ctx.fillRect(cx - 7, y - 44, 1, 5);
      ctx.fillRect(cx - 2, y - 44, 1, 5);
      ctx.fillRect(cx - 7, y - 39, 6, 1);
      // right frame
      ctx.fillRect(cx + 1, y - 45, 6, 1);
      ctx.fillRect(cx + 1, y - 44, 1, 5);
      ctx.fillRect(cx + 6, y - 44, 1, 5);
      ctx.fillRect(cx + 1, y - 39, 6, 1);
      // bridge
      ctx.fillRect(cx - 1, y - 43, 2, 1);
    }

    // tiny mouth
    if (palette.twintails){
      ctx.fillRect(cx - 1, y - 38, 2, 1);
    }

    // blush
    if (palette.blush){
      ctx.fillStyle = '#e88fae';
      ctx.fillRect(cx - 6, y - 40, 2, 1);
      ctx.fillRect(cx + 4, y - 40, 2, 1);
    }

    // dress detail / collar
    if (palette.twintails){
      ctx.fillStyle = palette.accent;
      ctx.fillRect(cx - 4, y - 35, 8, 2);
      ctx.fillRect(cx - 2, y - 33, 4, 4);
      ctx.fillRect(cx - 8, y - 20, 16, 2);
    }
  }

  function drawKuromi(cx, groundY, bob){
    const y = groundY - bob;

    // ears / jester hood
    ctx.fillStyle = '#241733';
    ctx.fillRect(cx - 9, y - 27, 5, 10);
    ctx.fillRect(cx + 4, y - 27, 5, 10);
    ctx.fillRect(cx - 11, y - 29, 4, 5);
    ctx.fillRect(cx + 7, y - 29, 4, 5);

    // hood/head
    ctx.fillRect(cx - 9, y - 22, 18, 15);

    // white face
    ctx.fillStyle = '#f7edf8';
    ctx.fillRect(cx - 7, y - 19, 14, 10);
    ctx.fillRect(cx - 5, y - 21, 10, 13);

    // eyes
    ctx.fillStyle = '#241733';
    ctx.fillRect(cx - 4, y - 16, 2, 3);
    ctx.fillRect(cx + 2, y - 16, 2, 3);

    // tiny mouth
    ctx.fillRect(cx - 1, y - 11, 2, 1);

    // pink skull mark
    ctx.fillStyle = '#e88fae';
    ctx.fillRect(cx - 3, y - 24, 6, 4);
    ctx.fillRect(cx - 4, y - 23, 8, 2);
    ctx.fillStyle = '#241733';
    ctx.fillRect(cx - 2, y - 23, 1, 1);
    ctx.fillRect(cx + 1, y - 23, 1, 1);

    // body
    ctx.fillStyle = '#241733';
    ctx.fillRect(cx - 6, y - 8, 12, 7);
    ctx.fillRect(cx - 8, y - 6, 3, 5);
    ctx.fillRect(cx + 5, y - 6, 3, 5);

    // little tail
    ctx.fillRect(cx + 7, y - 6, 4, 2);
    ctx.fillRect(cx + 10, y - 8, 2, 3);
  }

  const ismailPalette = { skin:'#f1c39a', hair:'#2b2320', shirt:'#c93b45', pants:'#2c2c34', twintails:false, blush:false, glasses:true };
  const fofoPalette = { skin:'#f7d0b0', hair:'#8b5cf6', accent:'#c084fc', shirt:'#9b6fd8', pants:'#7a55bf', twintails:true, blush:true, glasses:true };

  function frame(t){
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawStars(t);
    drawMoon();
    drawGround();
    drawTable(t);

    const bob1 = reduceMotion ? 0 : Math.sin(t / 500) * 1;
    const bob2 = reduceMotion ? 0 : Math.sin(t / 500 + 1.4) * 1;
    drawCharacter(56, 178, ismailPalette, false, bob1);
    drawCharacter(264, 178, fofoPalette, true, bob2);
    drawKuromi(296, 177, reduceMotion ? 0 : Math.sin(t / 500 + 2.2) * 1);

    if (!reduceMotion) requestAnimationFrame(frame);
  }
  frame(0);
})();
</script>
